# FinSentinel nginx reverse-proxy configuration
#
# Purpose: TLS termination, rate limiting, XFF injection, body size limit,
#          and connection buffering so uvicorn is never exposed directly.
#
# Assumptions:
#   - nginx runs on the same host as uvicorn (127.0.0.1:8000)
#   - TLS certificate managed by Let's Encrypt (or replace cert paths)
#   - nginx 1.18+ (or any nginx that supports limit_req, http2, ssl_session_*)
#   - This file is included inside the http {} block of the main nginx.conf
#
# After editing: `nginx -t` to test, then `nginx -s reload`.

# ---------------------------------------------------------------------------
# Rate-limit zones (must be at http {} scope — place here if this file is
# included directly inside http {}, or move to main nginx.conf otherwise)
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=finsentinel_ingestion:10m rate=5r/s;
# 5 req/s per source IP for ingestion endpoints.
# 10m shared memory = ~160k IP addresses.  Tune rate to match expected load.

limit_req_zone $binary_remote_addr zone=finsentinel_operator:1m rate=10r/m;
# 10 req/min per source IP for operator/approval endpoints.

# ---------------------------------------------------------------------------
# Upstream
# ---------------------------------------------------------------------------

upstream finsentinel_app {
    server 127.0.0.1:8000;
    keepalive 32;  # Reuse connections to uvicorn for throughput.
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name finsentinel.example.com;

    # ACME challenge (Let's Encrypt renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finsentinel.example.com;

    # TLS certificate (replace with your certificate paths)
    ssl_certificate     /etc/letsencrypt/live/finsentinel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finsentinel.example.com/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS: tell browsers to use HTTPS for 1 year.
    # Remove 'includeSubDomains' if sub-domains don't have valid certs.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # API-only service; deny all document/resource loads from browsers.
    add_header Content-Security-Policy "default-src 'none'" always;

    # Body size limit: match RequestBodyLimitMiddleware (10 MB).
    # nginx rejects before reading; app middleware rejects after.
    client_max_body_size 10m;

    # Client-to-nginx body-read timeout (protects nginx from slow-loris on body).
    # Match FINSENTINEL_BODY_READ_TIMEOUT_SECONDS in .env.
    client_body_timeout 30s;

    # Header-read timeout (before the full request headers are received).
    client_header_timeout 10s;

    # ---------------------------------------------------------------------------
    # Ingestion endpoint — rate-limited
    # The actual endpoint is POST /api/v1/updates (not /ingest).
    # ---------------------------------------------------------------------------

    location /api/v1/updates {
        # Rate limit: burst of 20 requests; excess requests are rejected immediately.
        limit_req zone=finsentinel_ingestion burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://finsentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Inject true client IP.  uvicorn reads scope["client"][0] from the
        # TCP connection; X-Real-IP is for any upstream component that needs it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream timeouts.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------------------------------------------------------------------
    # Operator API and approval endpoints — rate-limited, app-auth required
    #
    # The application enforces bearer-token authentication (FINSENTINEL_OPERATOR_TOKEN)
    # on all /api/v1/operator/ and /api/v1/approvals/ routes.  nginx adds an
    # additional rate limit layer to slow brute-force token guessing.
    # ---------------------------------------------------------------------------

    location /api/v1/operator/ {
        limit_req zone=finsentinel_operator burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://finsentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /api/v1/approvals/ {
        limit_req zone=finsentinel_operator burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://finsentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------------------------------------------------------------------------
    # /health/metrics — application enforces operator-token auth (see Task 7).
    # Restrict to known monitoring source IPs when possible.
    # Uncomment and edit the allow/deny lines for IP-based restriction:
    #
    #   allow 10.0.1.5;      # monitoring agent host
    #   deny  all;
    # ---------------------------------------------------------------------------

    location /api/v1/health/metrics {
        # Application requires operator bearer token; this block isolates
        # the endpoint for IP-based restrictions at the nginx layer if needed.
        proxy_pass http://finsentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------------------------------------------------------------------
    # Health liveness check — bypasses rate limit (used by load-balancer probes)
    # ---------------------------------------------------------------------------

    location = /api/v1/health {
        proxy_pass http://finsentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # /health/alerts — structured alert endpoint for external monitoring tools.
    # No application auth required; expose to monitoring agents only.
    # ---------------------------------------------------------------------------

    location = /api/v1/health/alerts {
        proxy_pass http://finsentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # All other endpoints (aggregation, schema registry, etc.)
    # ---------------------------------------------------------------------------

    location / {
        proxy_pass http://finsentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ---------------------------------------------------------------------------
# Notes for Windows deployment
# ---------------------------------------------------------------------------
#
# On Windows, nginx runs natively (nginx.exe from https://nginx.org/en/download.html).
# The config paths use forward slashes even on Windows.
# TLS certificate paths must be absolute (e.g. C:/nginx/ssl/cert.pem).
#
# Start: nginx.exe -c C:/nginx/conf/nginx.conf
# Reload: nginx.exe -s reload
# Stop:   nginx.exe -s quit
#
# NSSM can wrap nginx.exe as a Windows service (same as for uvicorn):
#   nssm install nginx "C:\nginx\nginx.exe"
#   nssm set nginx AppParameters "-c C:/nginx/conf/nginx.conf"
#   nssm set nginx AppDirectory "C:\nginx"
#   nssm set nginx Start SERVICE_AUTO_START
#   nssm start nginx
#
# DEPLOYMENT TEST NOTE: nginx config correctness cannot be verified without
# a running nginx installation.  Validate with `nginx -t` before deploying.
