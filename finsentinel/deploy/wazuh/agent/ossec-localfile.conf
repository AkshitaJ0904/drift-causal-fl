<!-- Wazuh Windows agent configuration fragment.
     Add this <localfile> block inside the <ossec_config> section of
     C:\Program Files (x86)\ossec-agent\ossec.conf after installing the
     Wazuh agent MSI.

     Adjust the path to wherever FinSentinel writes the SIEM event log.
     The file is in JSONL format: one JSON object per line.
-->

<localfile>
  <!-- Wazuh reads one line at a time and applies the finsentinel decoder. -->
  <log_format>json</log_format>
  <location>C:\Users\Hp\.finsentinel\siem\finsentinel-siem.jsonl</location>
</localfile>
