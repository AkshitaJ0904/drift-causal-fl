# Wazuh 4.8.2 single-node + PostgreSQL for FinSentinel development
# Run from inside WSL2 (Ubuntu) using setup-wsl.sh (generates certs first).
#
# Services:
#   wazuh.manager   — SIEM core + API (:1514 agent, :55000 REST API)
#   wazuh.indexer   — OpenSearch (:9200)
#   wazuh.dashboard — Kibana UI (:443)
#   postgres        — PostgreSQL 15 (:5432, closes the FinSentinel test gap)
#
# Usage (via setup-wsl.sh — preferred):
#   bash setup-wsl.sh
#
# Manual usage:
#   docker compose -f generate-indexer-certs.yml run --rm generator
#   docker compose --env-file ~/finsentinel-wazuh/.env up -d

services:
  # ── Wazuh Indexer (OpenSearch) ─────────────────────────────────────────────
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.8.2
    container_name: wazuh-indexer
    restart: unless-stopped
    hostname: wazuh.indexer
    environment:
      # MaxDirectMemorySize must be set explicitly: the security plugin reads all
      # files in the install dir to detect tampering, and the default limit is too
      # small to cover the JDK binaries when any config file has loose permissions.
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${INDEXER_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      # All cert/config files come from the Linux filesystem (WAZUH_CONFIG_DIR in .env).
      # Mounting from /mnt/d (drvfs) makes all files appear as 0777, which causes the
      # OpenSearch security plugin to scan the entire JDK and OOM on startup.
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    healthcheck:
      # Check the OpenSearch security API, not just _cluster/health.
      # _cluster/health returns green while the security plugin is still
      # initializing, causing the dashboard to hit ResponseErrors and restart-loop.
      # The security users endpoint only returns HTTP 200 once the plugin is fully
      # ready — that is the actual gate the dashboard needs.
      test:
        - CMD-SHELL
        - "curl -k -s -u ${INDEXER_USERNAME:-admin}:${INDEXER_PASSWORD} https://localhost:9200/_opendistro/_security/api/internalusers/admin | grep -q 'backend_roles'"
      interval: 30s
      timeout: 15s
      retries: 15
      # OpenSearch + security plugin initialization takes 90-150 s on cold start.
      start_period: 150s
    # Give the JVM enough time to flush and shut down cleanly.
    # Without this WSL calls reboot(RB_POWER_OFF) after 10 s SIGTERM timeout.
    stop_grace_period: 90s

  # ── Wazuh Manager ─────────────────────────────────────────────────────────
  wazuh.manager:
    image: wazuh/wazuh-manager:4.8.2
    container_name: wazuh-manager
    restart: unless-stopped
    hostname: wazuh.manager
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=${INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      # SSL cert paths consumed by 1-config-filebeat init script to configure filebeat.yml.
      # Without these the init script leaves ssl.certificate_authorities/certificate/key
      # commented out → Filebeat cannot verify the indexer cert → x509 unknown authority.
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=${API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${API_PASSWORD}
    # All ports bound to localhost only - local dev stack with official default credentials.
    ports:
      - "127.0.0.1:1514:1514"       # agent TCP
      - "127.0.0.1:1515:1515"       # agent enrollment
      - "127.0.0.1:55000:55000"     # REST API
    volumes:
      # Official 10 named volumes (persist manager state across restarts)
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      # Manager TLS certs for Filebeat → Indexer (Linux filesystem, not drvfs)
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      # Manager config (ossec.conf) — from Linux filesystem
      - ${WAZUH_CONFIG_DIR}/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # FinSentinel custom rules (single file - Wazuh does not load rule subfolders).
      # Events use Wazuh's built-in JSON decoder (log_format json), so no custom decoder.
      - ./rules/finsentinel_rules.xml:/var/ossec/etc/rules/finsentinel_rules.xml
      # FinSentinel SIEM event log (read-only mount so manager can tail it)
      - type: bind
        source: "${FINSENTINEL_LOGS_DIR:-/tmp/finsentinel-logs}"
        target: /finsentinel-logs
        read_only: true
    healthcheck:
      # Wazuh 4.8.x API uses JWT; Basic Auth is only accepted on /security/user/authenticate.
      # POST to that endpoint and check that the response contains a token.
      test:
        - CMD-SHELL
        - "curl -s -k -X POST -u ${API_USERNAME:-wazuh-wui}:${API_PASSWORD} https://localhost:55000/security/user/authenticate | grep -q '\"token\"'"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── Wazuh Dashboard ───────────────────────────────────────────────────────
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.8.2
    container_name: wazuh-dashboard
    restart: unless-stopped
    hostname: wazuh.dashboard
    depends_on:
      wazuh.manager:
        condition: service_healthy
    environment:
      - INDEXER_USERNAME=${INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      # DASHBOARD_USERNAME/PASSWORD = OpenSearch keystore credentials (entrypoint.sh).
      # Must match an OpenSearch internal user (admin), NOT the Wazuh API user (wazuh-wui).
      # Wazuh API credentials are configured separately via API_USERNAME/API_PASSWORD → wazuh.yml.
      - DASHBOARD_USERNAME=${INDEXER_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${INDEXER_PASSWORD}
    ports:
      - "127.0.0.1:443:5601"
    volumes:
      - wazuh-dashboard-data:/usr/share/wazuh-dashboard/data
      # Dashboard TLS certs (Linux filesystem, not drvfs)
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      # Dashboard config (Linux filesystem)
      - ${WAZUH_CONFIG_DIR}/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ${WAZUH_CONFIG_DIR}/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -k -u ${INDEXER_USERNAME:-admin}:${INDEXER_PASSWORD} https://localhost:5601/api/status | grep -q '\"overall\"'"
      interval: 30s
      timeout: 10s
      retries: 20
      # Wazuh security plugin enforces auth even on /api/status.
      # Healthcheck uses INDEXER_USERNAME/PASSWORD (admin) from the container env.
      # Wazuh plugin init takes 5-10 min on cold start; 600s start_period + 20×30s
      # retries = up to 16 min total before the healthcheck can mark unhealthy.
      start_period: 600s

  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────
  # Closes the 3-skipped FinSentinel integration tests:
  #   export FINSENTINEL_POSTGRES_TEST=1
  #   export PG_MIGRATION_TEST_PASSWORD=<same as POSTGRES_PASSWORD>
  postgres:
    # Debian image ships a self-signed snakeoil cert, needed because the test
    # connection string uses sslmode=require. Disposable local test DB only.
    image: postgres:15
    container_name: finsentinel-postgres
    restart: unless-stopped
    command:
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem"
      - "-c"
      - "ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key"
    environment:
      - POSTGRES_USER=finsentinel_migration_test
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=finsentinel_migration_test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsentinel_migration_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Indexer
  wazuh-indexer-data:
  # Manager (official 10 + filebeat)
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  # Dashboard
  wazuh-dashboard-data:
  # PostgreSQL
  postgres-data:
